<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChronoTech - IA Histórica</title>
<meta name="theme-color" content="#e8f1f8">
<meta name="description" content="Explora la historia de la tecnología con IA.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.ct_theme||'null')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--tint:255,255,255;--text:#0f172a;--muted:rgba(15,23,42,.68);--accent:#0369a1;--on-accent:#fff;
  --glass:rgba(var(--tint),.55);--capsule:rgba(var(--tint),.65);--panel:rgba(var(--tint),.4);
  --edge-top:rgba(255,255,255,.9);--edge-bot:rgba(15,23,42,.15);--shadow:rgba(15,23,42,.14);--inset:rgba(255,255,255,.6);
  --bubble-user:#0369a1;--bg1:rgba(103,232,249,.55);--bg2:rgba(125,211,252,.6);--bg3:rgba(167,243,208,.6);--base:#e8f1f8;color-scheme:light}
:root[data-theme=dark]{--tint:15,23,42;--text:#f1f5f9;--muted:rgba(241,245,249,.72);--accent:#38bdf8;--on-accent:#082f49;
  --edge-top:rgba(255,255,255,.22);--edge-bot:rgba(0,0,0,.5);--shadow:rgba(0,0,0,.55);--inset:rgba(255,255,255,.1);
  --bg1:rgba(14,116,144,.5);--bg2:rgba(30,64,175,.45);--bg3:rgba(6,95,70,.45);--base:#020617;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--base);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* Fondo: gradientes estáticos (mucho más ligero que blobs con blur de 100px) */
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;
  background-image:radial-gradient(40rem 30rem at 10% 0%,var(--bg1),transparent 70%),
  radial-gradient(35rem 30rem at 95% 30%,var(--bg2),transparent 70%),
  radial-gradient(45rem 30rem at 30% 105%,var(--bg3),transparent 70%)}
.app{position:relative;z-index:1;height:100dvh;padding:max(env(safe-area-inset-top),.75rem) .75rem max(env(safe-area-inset-bottom),.75rem);display:flex;justify-content:center}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.25);border-top:2px solid var(--edge-top);border-bottom:1px solid var(--edge-bot);
  box-shadow:0 30px 60px -20px var(--shadow),inset 0 6px 12px var(--inset)}
.shell{width:100%;max-width:1400px;display:flex;border-radius:clamp(1.5rem,4vw,3rem);overflow:hidden;min-height:0}
.cap{background:var(--capsule);border:1px solid rgba(255,255,255,.35);border-top:2px solid var(--edge-top);border-bottom:1px solid var(--edge-bot);
  border-radius:9999px;box-shadow:0 8px 16px -6px var(--shadow),inset 0 3px 5px var(--inset);transition:transform .2s,box-shadow .2s}
.cap:hover{transform:translateY(-2px)}
.cap:active{transform:scale(.97)}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.25);border-radius:1.25rem}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Sidebar: fija en escritorio, cajón en móvil */
aside{width:20rem;flex-shrink:0;display:flex;flex-direction:column;gap:.75rem;padding:1.5rem;border-right:1px solid rgba(255,255,255,.3)}
#history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem}
.hist{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;text-align:left;width:100%}
.hist[aria-current=true]{outline:2px solid var(--accent)}
.hist span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem;font-weight:600}
@media(max-width:767px){
  aside{position:fixed;inset:0 20% 0 0;z-index:30;background:var(--glass);backdrop-filter:blur(24px);transform:translateX(-105%);transition:transform .3s}
  aside.open{transform:none}
  #scrim{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.4)}
}
@media(min-width:768px){#menuBtn,#scrim{display:none!important}}

main{flex:1;display:flex;flex-direction:column;min-width:0;padding:1rem 1.25rem}
@media(min-width:768px){main{padding:1.5rem 2rem}}
header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-bottom:.75rem}
.icon-btn{width:2.75rem;height:2.75rem;display:grid;place-items:center}
.icon-btn svg{width:1.25rem;height:1.25rem}

#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1rem;padding:.5rem .25rem;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;max-width:32rem}
.empty h2{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 .75rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1.25rem}
.chips button{padding:.6rem 1rem;font-size:.9rem;font-weight:600}
.msg{max-width:min(46rem,90%);padding:.85rem 1.1rem;border-radius:1.25rem;line-height:1.6;overflow-wrap:anywhere}
.msg.user{white-space:pre-wrap;color:#fff;align-self:flex-end;background:var(--bubble-user);color:var(--bubble-user-text);border-bottom-right-radius:.4rem}
.msg.ai{align-self:flex-start;background:var(--capsule);border:1px solid rgba(255,255,255,.4);border-bottom-left-radius:.4rem}
.msg.err{border:1px solid #dc2626;color:#991b1b;background:rgba(254,226,226,.85)}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}

form.composer{display:flex;align-items:center;gap:.25rem;padding:.4rem;max-width:56rem;width:100%;margin:.75rem auto 0}
form.composer input{flex:1;min-width:0;background:none;border:0;outline:0;padding:.8rem;font-weight:600;font-size:1rem}
form.composer input::placeholder{color:var(--muted)}
.send{width:3rem;height:3rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex-shrink:0}
.send:disabled{opacity:.5;cursor:not-allowed}
.note{text-align:center;font-size:.75rem;margin:.6rem 0 0}

dialog{border:0;padding:0;background:none;color:var(--text);width:min(28rem,92vw)}
dialog::backdrop{background:rgba(2,6,23,.45);backdrop-filter:blur(6px)}
.modal{padding:1.5rem;display:flex;flex-direction:column;gap:1.1rem;border-radius:1.5rem}
.modal label{display:block;font-size:.85rem;font-weight:700;margin-bottom:.4rem}
.modal input[type=password],.modal input[type=text]{width:100%;padding:.75rem 1rem;background:var(--capsule);border:1px solid var(--edge-bot);border-radius:9999px;outline:0}
.modal input:focus-visible{outline:3px solid var(--accent)}
.modal select{width:100%;padding:.75rem 1rem;background:var(--capsule);border:1px solid var(--edge-bot);border-radius:9999px;color:var(--text)}
.src{margin-top:.7rem;padding-top:.5rem;border-top:1px solid var(--edge-bot);font-size:.8rem;display:flex;flex-wrap:wrap;gap:.3rem .8rem}
.src a{color:var(--accent);font-weight:600}
.primary{background:var(--accent);color:var(--on-accent);padding:.8rem;font-weight:700;border-radius:9999px;width:100%}
.link{font-size:.85rem;text-decoration:underline;font-weight:600}
.msg p{margin:0 0 .6em}.msg>*:last-child{margin-bottom:0}.msg h4{margin:.4em 0 .4em;font-size:1.05rem}
.msg ul,.msg ol{margin:0 0 .6em;padding-left:1.3rem}
.msg code{background:rgba(127,127,127,.22);padding:.1em .35em;border-radius:.35rem;font-size:.9em}
.msg pre{background:rgba(2,6,23,.75);color:#e2e8f0;padding:.8rem;border-radius:.8rem;overflow-x:auto;margin:0 0 .6em}
.msg pre code{background:none;padding:0}
:root[data-theme=dark] .msg.err{color:#fecaca;background:rgba(127,29,29,.6)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bg"></div>
<div class="app">
 <div class="shell glass">
  <div id="scrim" class="hidden"></div>
  <aside id="side" aria-label="Historial">
   <div style="display:flex;align-items:center;gap:.75rem">
    <div class="cap icon-btn" aria-hidden="true"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
    <h1 style="font-size:1.4rem;margin:0">ChronoTech</h1>
   </div>
   <button id="newBtn" class="cap" style="padding:.9rem;font-weight:700">+ Nueva exploración</button>
   <button id="installBtn" class="cap hidden" style="padding:.7rem;font-weight:600;font-size:.9rem">Instalar como app</button>
   <p class="muted" style="font-size:.8rem;font-weight:700;margin:.5rem .5rem 0">Exploraciones anteriores</p>
   <div id="history"></div>
  </aside>

  <main>
   <header>
    <div style="display:flex;align-items:center;gap:.75rem">
     <button id="menuBtn" class="cap icon-btn" aria-label="Abrir historial"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
     <h2 style="font-size:1.15rem;margin:0">Motor histórico IA</h2>
    </div>
    <div style="display:flex;gap:.5rem"><button id="themeBtn" class="cap icon-btn" aria-label="Cambiar tema"></button><button id="settingsBtn" class="cap icon-btn" aria-label="Ajustes"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10l2 2M19 5l-2 2M7 17l-2 2"/></svg></button></div>
   </header>

   <div id="chat" role="log" aria-live="polite"></div>

   <button type="button" id="attachPrev" class="cap hidden" style="align-self:center;padding:.35rem .9rem;font-size:.85rem;font-weight:600;margin-top:.5rem">🖼️ Imagen adjunta · quitar ✕</button>
   <form id="form" class="composer cap" autocomplete="off">
    <button type="button" id="attachBtn" class="icon-btn" aria-label="Adjuntar imagen"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3"/></svg></button><input type="file" id="imgIn" accept="image/*" class="hidden">
    <label for="q" class="sr">Tu pregunta</label>
    <input id="q" type="text" placeholder="Pregunta sobre un invento, pionero o hito…" maxlength="2000">
    <button class="send" id="sendBtn" aria-label="Enviar"><svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19V6m0 0l-7 7m7-7l7 7"/></svg></button>
   </form>
   <p class="note muted">Verifica los datos históricos con fuentes cruzadas.</p>
  </main>
 </div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
 <form method="dialog" class="modal glass" id="settingsForm">
  <h3 id="dlgTitle" style="margin:0">Ajustes</h3>
  <div>
   <label for="apiKey">Clave de API de Google Gemini</label>
   <input type="password" id="apiKey" placeholder="AIzaSy…" autocomplete="off">
   <p class="muted" style="font-size:.78rem;margin:.4rem 0 0">Se guarda solo en este navegador. Úsala únicamente en tu equipo personal.</p>
   <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:.5rem"><button type="button" id="testKey" class="link">Probar clave y cargar modelos</button><a class="link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Obtener clave</a></div>
   <p id="keyStatus" class="muted" style="font-size:.82rem;margin:.4rem 0 0" role="status"></p>
  </div>
  <div>
   <label for="model">Modelo</label>
   <select id="model"></select>
  </div>
  <div>
   <label style="display:flex;gap:.6rem;align-items:center;cursor:pointer"><input type="checkbox" id="ground" style="width:1.1rem;height:1.1rem"> Buscar en Google para verificar datos</label>
   <p class="muted" style="font-size:.78rem;margin:.4rem 0 0">Añade fuentes a las respuestas. Puede no estar disponible en todos los planes.</p>
  </div>
  <div>
   <label for="bgUpload">Fondo personalizado</label>
   <input type="file" id="bgUpload" accept="image/*">
   <button type="button" id="bgReset" class="link">Restaurar fondo</button>
  </div>
  <button class="primary" value="ok">Guardar</button>
 </form>
</dialog>

<script>
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn('Almacenamiento lleno',e)}}
};
const API='https://generativelanguage.googleapis.com/v1beta/models/';
const SUGGEST=['¿Cómo funcionaba el mecanismo de Anticitera?','Explica la máquina analítica de Babbage','¿Qué cambió con el transistor en 1947?'];
const ICON={
  send:'<path stroke-linecap="round" stroke-linejoin="round" d="M12 19V6m0 0l-7 7m7-7l7 7"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/>',
  moon:'<path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'
};
let chats=store.get('ct_chats',[]),cur=null,ctrl=null,bgRGB=null;

/* ---------- Tema ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
const theme=()=>store.get('ct_theme',null)||(mq.matches?'dark':'light');
function applyTheme(){
  const t=theme(),r=document.documentElement;
  r.dataset.theme=t;
  r.style.setProperty('--tint',t==='dark'&&bgRGB?bgRGB.map(v=>v*.35|0).join(','):'');
  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#020617':'#e8f1f8';
  $('themeBtn').setAttribute('aria-label',t==='dark'?'Cambiar a modo claro':'Cambiar a modo oscuro');
  $('themeBtn').innerHTML=`<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">${t==='dark'?ICON.sun:ICON.moon}</svg>`;
}
$('themeBtn').onclick=()=>{store.set('ct_theme',theme()==='dark'?'light':'dark');applyTheme()};
mq.onchange=()=>{if(!store.get('ct_theme',null))applyTheme()};

/* ---------- Markdown seguro (escapa HTML primero) ---------- */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=t=>t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*\n]*)\*/g,'$1<em>$2</em>');
function md(src){
  const code=[];
  const s=esc(src).replace(/```[\w-]*\n?([\s\S]*?)(```|$)/g,(_,c)=>{code.push(c);return `\u0000${code.length-1}\u0000`});
  const html=s.split(/\n{2,}/).map(b=>{
    b=b.trim();if(!b)return '';
    if(/^\u0000\d+\u0000$/.test(b))return b;
    const L=b.split('\n'),h=b.match(/^#{1,4}\s+(.*)$/);
    if(h&&L.length===1)return `<h4>${inl(h[1])}</h4>`;
    if(L.every(l=>/^\s*[-*•]\s+/.test(l)))return '<ul>'+L.map(l=>`<li>${inl(l.replace(/^\s*[-*•]\s+/,''))}</li>`).join('')+'</ul>';
    if(L.every(l=>/^\s*\d+[.)]\s+/.test(l)))return '<ol>'+L.map(l=>`<li>${inl(l.replace(/^\s*\d+[.)]\s+/,''))}</li>`).join('')+'</ol>';
    return `<p>${inl(b).replace(/\n/g,'<br>')}</p>`;
  }).join('');
  return html.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre><code>${code[i]}</code></pre>`);
}

/* ---------- Render ---------- */
function renderHistory(){
  const box=$('history');box.textContent='';
  if(!chats.length){const p=document.createElement('p');p.className='muted';p.style.cssText='font-size:.85rem;padding:.5rem';p.textContent='Aún no hay exploraciones.';box.append(p);return}
  chats.forEach(c=>{
    const b=document.createElement('button');b.className='hist panel';
    if(cur&&cur.id===c.id)b.setAttribute('aria-current','true');
    const s=document.createElement('span');s.textContent=c.title;
    const d=document.createElement('span');d.textContent='✕';d.style.cssText='flex:none;opacity:.6';d.title='Eliminar';d.setAttribute('role','button');d.setAttribute('aria-label','Eliminar '+c.title);
    d.onclick=e=>{e.stopPropagation();chats=chats.filter(x=>x.id!==c.id);store.set('ct_chats',chats);if(cur&&cur.id===c.id)newChat();else renderHistory()};
    b.append(s,d);b.onclick=()=>{if(ctrl)return;cur=c;renderChat();renderHistory();closeMenu()};box.append(b);
  });
}
function addSources(m,src){
  if(!src||!src.length)return;
  const d=document.createElement('div');d.className='src';d.append('Fuentes:');
  src.slice(0,6).forEach(s=>{if(!/^https?:\/\//.test(s.uri))return;const a=document.createElement('a');a.href=s.uri;a.target='_blank';a.rel='noopener noreferrer';a.textContent=s.title;d.append(a)});
  m.append(d);
}
function friendly(s,m=''){
  if(s===400&&/api key/i.test(m))return 'La clave de API no es válida. Revísala en Ajustes.';
  if(s===400)return 'Solicitud rechazada: '+m;
  if(s===401||s===403)return 'La clave no tiene permiso para este modelo o la API no está habilitada.';
  if(s===404)return 'El modelo seleccionado no existe. Elige otro en Ajustes.';
  if(s===429)return 'Alcanzaste el límite de uso. Espera un momento o revisa tu cuota.';
  if(s>=500)return 'Gemini está saturado. Inténtalo de nuevo en unos segundos.';
  return m||('Error '+s);
}
function bubble(role,text,cls='',src){
  const m=document.createElement('div');m.className='msg '+role+' '+cls;
  if(role==='ai')m.innerHTML=md(text);else m.textContent=text;
  addSources(m,src);
  $('chat').append(m);$('chat').scrollTop=$('chat').scrollHeight;return m;
}
function renderChat(){
  const box=$('chat');box.textContent='';
  if(!cur||!cur.msgs.length){
    const e=document.createElement('div');e.className='empty';
    e.innerHTML='<h2>¿Qué época tecnológica exploramos hoy?</h2><p class="muted">Del mecanismo de Anticitera a la era del silicio.</p><div class="chips"></div>';
    SUGGEST.forEach(t=>{const b=document.createElement('button');b.className='cap';b.textContent=t;b.onclick=()=>send(t);e.querySelector('.chips').append(b)});
    box.append(e);return;
  }
  cur.msgs.forEach(m=>bubble(m.role,(m.img?'🖼️ ':'')+m.text,'',m.sources));
}
function newChat(){if(ctrl)return;cur=null;renderChat();renderHistory();closeMenu();$('q').focus()}
function setBusy(b){
  $('sendBtn').innerHTML=`<svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">${b?ICON.stop:ICON.send}</svg>`;
  $('sendBtn').setAttribute('aria-label',b?'Detener respuesta':'Enviar');
}

/* ---------- Gemini con streaming ---------- */
async function send(text){
  text=text.trim();if(!text&&pendingImg)text='Describe esta imagen en su contexto histórico y tecnológico.';if(!text||ctrl)return;
  const key=store.get('ct_key','');
  if(!key){$('dlg').showModal();return}
  if(!cur){cur={id:Date.now(),title:text.slice(0,40),msgs:[]};chats.unshift(cur)}
  if(!cur.msgs.length)$('chat').textContent='';
  const img=pendingImg;pendingImg=null;renderPrev();
  cur.msgs.push({role:'user',text,img:!!img});bubble('user',(img?'🖼️ ':'')+text);$('q').value='';renderHistory();
  const wait=bubble('ai','');wait.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  ctrl=new AbortController();setBusy(true);
  let out='',sources=[];
  try{
    if(!navigator.onLine)throw new Error('Sin conexión a internet.');
    const model=store.get('ct_model','gemini-2.5-flash');
    const contents=cur.msgs.slice(-20).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}]}));
    if(img)contents[contents.length-1].parts.push({inlineData:{mimeType:img.mime,data:img.data}});
    const res=await fetch(`${API}${encodeURIComponent(model)}:streamGenerateContent?alt=sse`,{
      method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({
        systemInstruction:{parts:[{text:'Eres un historiador de la tecnología. Responde en español, con precisión, indicando fechas y personas clave, y señala incertidumbres históricas. Usa Markdown sencillo.'}]},
        contents,
        ...(store.get('ct_ground',false)?{tools:[{google_search:{}}]}:{})
      })
    });
    if(!res.ok){const d=await res.json().catch(()=>({}));throw new Error(friendly(res.status,d?.error?.message))}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){
        if(!l.startsWith('data:'))continue;
        try{const j=JSON.parse(l.slice(5));(j.candidates?.[0]?.groundingMetadata?.groundingChunks||[]).forEach(c=>c.web?.uri&&!sources.some(s=>s.uri===c.web.uri)&&sources.push({uri:c.web.uri,title:c.web.title||c.web.uri}));out+=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');wait.innerHTML=md(out);$('chat').scrollTop=$('chat').scrollHeight}catch{}
      }
    }
    if(!out)throw new Error('La respuesta llegó vacía o fue bloqueada. Reformula la pregunta.');
  }catch(e){
    if(!out){
      wait.className='msg ai err';
      wait.textContent=e.name==='AbortError'?'Respuesta detenida.':'No se pudo obtener respuesta: '+e.message;
      cur.msgs.pop();
    }
  }finally{
    if(out){cur.msgs.push({role:'ai',text:out,sources});addSources(wait,sources)}
    ctrl=null;setBusy(false);store.set('ct_chats',chats);renderHistory();
  }
}

/* ---------- Eventos ---------- */
$('form').onsubmit=e=>{e.preventDefault();if(ctrl){ctrl.abort();return}send($('q').value)};
$('newBtn').onclick=newChat;
const openMenu=()=>{$('side').classList.add('open');$('scrim').classList.remove('hidden')};
function closeMenu(){$('side').classList.remove('open');$('scrim').classList.add('hidden')}
$('menuBtn').onclick=openMenu;$('scrim').onclick=closeMenu;
let pendingImg=null;
const renderPrev=()=>$('attachPrev').classList.toggle('hidden',!pendingImg);
$('attachBtn').onclick=()=>$('imgIn').click();
$('attachPrev').onclick=()=>{pendingImg=null;renderPrev()};
$('imgIn').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s|0;c.height=im.height*s|0;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    pendingImg={mime:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]};renderPrev();
  };im.src=ev.target.result};
  r.readAsDataURL(f);
};
function fillModels(list,sel){
  const m=$('model');m.textContent='';if(!list.includes(sel))list.unshift(sel);
  list.forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;m.append(o)});m.value=sel;
}
$('settingsBtn').onclick=()=>{
  $('apiKey').value=store.get('ct_key','');$('ground').checked=store.get('ct_ground',false);$('keyStatus').textContent='';
  fillModels(['gemini-2.5-flash','gemini-2.5-pro','gemini-2.5-flash-lite'],store.get('ct_model','gemini-2.5-flash'));
  $('dlg').showModal();
};
$('settingsForm').onsubmit=()=>{store.set('ct_key',$('apiKey').value.trim());store.set('ct_model',$('model').value||'gemini-2.5-flash');store.set('ct_ground',$('ground').checked)};
$('testKey').onclick=async()=>{
  const k=$('apiKey').value.trim(),st=$('keyStatus');
  if(!k){st.textContent='Pega primero tu clave.';return}
  st.textContent='Probando…';
  try{
    const r=await fetch(API+'?pageSize=200',{headers:{'x-goog-api-key':k}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(friendly(r.status,d?.error?.message));
    const ms=(d.models||[]).filter(m=>/gemini/.test(m.name)&&(m.supportedGenerationMethods||[]).includes('generateContent')&&!/tts|image|live|embed|audio|robotics|computer-use/.test(m.name)).map(m=>m.name.replace('models/',''));
    if(!ms.length)throw new Error('La clave funciona, pero no hay modelos disponibles.');
    fillModels(ms,$('model').value);st.textContent='✓ Clave válida · '+ms.length+' modelos disponibles';
  }catch(e){st.textContent='✗ '+(e.message==='Failed to fetch'?'No hay conexión con Google.':e.message)}
};
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});

/* ---------- Instalación PWA ---------- */
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('installBtn').classList.remove('hidden')});
$('installBtn').onclick=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;$('installBtn').classList.add('hidden')};
addEventListener('appinstalled',()=>$('installBtn').classList.add('hidden'));
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* ---------- Fondo personalizado ---------- */
function setBg(src,save){
  const img=new Image();
  img.onload=()=>{
    const s=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height).data;let R=0,G=0,B=0,n=0;
    for(let i=0;i<d.length;i+=4*97){R+=d[i];G+=d[i+1];B+=d[i+2];n++}
    bgRGB=[R/n|0,G/n|0,B/n|0];
    const url=c.toDataURL('image/jpeg',.8);
    $('bg').style.backgroundImage=`url(${url})`;applyTheme();
    if(save)store.set('ct_bg',url);
  };
  img.src=src;
}
$('bgUpload').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setBg(ev.target.result,true);r.readAsDataURL(f)};
$('bgReset').onclick=()=>{localStorage.removeItem('ct_bg');bgRGB=null;$('bg').style.backgroundImage='';$('bgUpload').value='';applyTheme()};

/* ---------- Inicio ---------- */
applyTheme();setBusy(false);
const savedBg=store.get('ct_bg',null);if(savedBg)setBg(savedBg,false);
renderChat();renderHistory();
</script>
